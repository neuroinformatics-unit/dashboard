name: Deploy quarto site to GitHub Pages
on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Build step runs on each pull request
  pull_request:
  schedule:
   # Runs at 6am UTC every day
    - cron: '10 6 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
env:
  GRAPHQL_TOKEN: ${{ secrets.GRAPHQL_TOKEN }}
  PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
  ORGANIZATION_NAME: ${{ vars.ORGANIZATION_NAME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-west-2
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Get current date
        id: date
        run: echo "DATE=$(date +'%Y-%m')" >> $GITHUB_ENV

      - name: Restore conda downloads cache
        uses: actions/cache@v5
        with:
          path: ~/.dashboard
          key: data-cache-${{ env.DATE }}
          restore-keys: |
            data-cache-
            conda-download-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[dev]'

      - name: Fetch and save data
        run: python -m oss_dashboard.main

      # Incrementally pull new BrainGlobe atlas S3 access logs and append
      # per-day totals to the committed Parquet summaries (the atlas breakdown
      # and the country breakdown are separate tables). Skipped automatically
      # when AWS credentials are absent (e.g. fork PRs) - the committed
      # Parquets still render.
      - name: Update atlas usage statistics
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: python -m oss_dashboard.atlas_logs

      - name: Commit updated atlas usage data
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oss_dashboard/data/atlas_usage.parquet \
                  oss_dashboard/data/atlas_usage_by_country.parquet \
                  oss_dashboard/data/atlas_usage_by_tool.parquet \
                  oss_dashboard/data/atlas_usage_state.json
          git diff --cached --quiet || git commit -m "Update atlas usage data [skip ci]"
          git push

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Render site
      - name: Render site
        run: quarto render

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        if: ((github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'schedule')) || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: dashboard.neuroinformatics.dev
